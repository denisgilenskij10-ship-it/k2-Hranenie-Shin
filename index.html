<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K2 — Хранение шин</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#111;color:#fff;min-height:100vh}
header{background:linear-gradient(135deg,#050505,#252525);padding:22px 18px;border-bottom:2px solid #c9a227}
header h1{color:#c9a227;font-size:28px}
header p{color:#bbb;margin-top:6px}
.container{max-width:700px;margin:auto;padding:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:#1c1c1c;border:1px solid #333;border-radius:12px;padding:14px 8px;text-align:center}
.stat b{display:block;font-size:24px;color:#c9a227}
.stat span{color:#aaa;font-size:12px}
input,select{width:100%;padding:15px;border-radius:12px;border:1px solid #444;background:#222;color:white;font-size:16px;margin-bottom:12px}
button{border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:bold;cursor:pointer}
.add-btn,.save-btn{width:100%;background:#c9a227;color:#000;margin-bottom:12px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.tool-btn{background:#2a2a2a;color:#fff;border:1px solid #444}
.backup-btn{background:#2a2a2a;color:#c9a227;border:1px solid #555}
.restore-btn{grid-column:1/-1;background:#2a2a2a;color:#fff;border:1px solid #555}
.form{display:none;background:#1c1c1c;padding:18px;border-radius:16px;margin-bottom:20px;border:1px solid #444}
.form h2{margin-bottom:15px;color:#c9a227}
.cancel-btn{width:100%;background:#333;color:#fff}
.records-title{margin:15px 0;color:#c9a227}
.card{background:#1d1d1d;border:1px solid #333;border-left:4px solid #c9a227;padding:16px;border-radius:12px;margin-bottom:12px}
.card h3{margin-bottom:10px;font-size:19px}
.card p{color:#ccc;margin:7px 0}
.fio{font-size:18px;color:#fff!important;font-weight:bold}
.status{display:inline-block;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:bold;margin-bottom:10px}
.stored{background:#304b30;color:#9bea9b}
.returned{background:#4b3030;color:#ff9999}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.edit{background:#c9a227;color:#000}
.status-btn{background:#333;color:#fff}
.delete{grid-column:1/-1;background:#333;color:#ff7777}
.empty{color:#777;text-align:center;padding:30px}
.loading{text-align:center;padding:25px;color:#c9a227}
.small-note{color:#777;font-size:12px;margin-top:7px}
</style>
</head>

<body>

<header>
<h1>K2 — Хранение шин</h1>
<p>Учёт клиентов и хранения колёс</p>
</header>

<div class="container">

<div class="stats">
<div class="stat"><b id="total">0</b><span>Всего</span></div>
<div class="stat"><b id="stored">0</b><span>На хранении</span></div>
<div class="stat"><b id="places">0</b><span>Занято мест</span></div>
</div>

<input type="text" id="search"
placeholder="🔎 ФИО, телефон, машина, договор, место..."
oninput="searchRecords()">

<select id="statusFilter" onchange="searchRecords()">
<option value="all">Все записи</option>
<option value="stored">Только на хранении</option>
<option value="returned">Только выданные</option>
</select>

<button class="add-btn" onclick="showForm()">
+ Добавить хранение
</button>

<div class="tools">

<button class="tool-btn" onclick="exportExcel()">
📊 Excel
</button>

<button class="backup-btn" onclick="createBackup()">
💾 Резервная копия
</button>

<button class="restore-btn"
onclick="document.getElementById('backupFile').click()">
♻️ Восстановить из копии
</button>

<input type="file"
id="backupFile"
accept=".json,application/json"
style="display:none"
onchange="restoreBackup(event)">

</div>

<div class="form" id="form">

<h2 id="formTitle">Новое хранение</h2>

<input type="text" id="fio"
placeholder="Фамилия Имя Отчество">

<input type="number" id="contract"
placeholder="Номер договора (1–250)"
min="1" max="250">

<input type="text" id="car"
placeholder="Номер автомобиля">

<input type="tel" id="phone"
placeholder="Номер телефона">

<input type="text" id="tires"
placeholder="Размер колёс">

<input type="text" id="place"
placeholder="Номер места">

<select id="status">
<option value="stored">На хранении</option>
<option value="returned">Выдано</option>
</select>

<button class="save-btn" onclick="saveRecord()">
Сохранить
</button>

<button class="cancel-btn" onclick="cancelForm()">
Отмена
</button>

</div>

<h2 class="records-title">Хранение</h2>

<div id="records">
<div class="loading">Загрузка...</div>
</div>

</div>

<script>

const SUPABASE_URL =
"https://idbzuilzkmwmttfvjxyy.supabase.co";

const SUPABASE_KEY =
"sb_publishable_jw6h0nV3HggGUhaz5jhXOQ_48Eph7OL";

let records = [];
let editingId = null;

async function api(path="",options={}){

const response=await fetch(
SUPABASE_URL+"/rest/v1/k2_records"+path,
{
...options,
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY,
"Content-Type":"application/json",
"Prefer":options.prefer||"return=representation",
...(options.headers||{})
}
});

if(!response.ok){
const error=await response.text();
throw new Error(error);
}

const text=await response.text();
return text?JSON.parse(text):[];
}

async function loadRecords(){

try{

records=await api("?select=*&order=contract.asc");
renderRecords();

}catch(error){

console.error(error);

document.getElementById("records").innerHTML=
'<div class="empty">Ошибка подключения к базе</div>';

}
}

function showForm(){

editingId=null;

document.getElementById("formTitle").textContent=
"Новое хранение";

["fio","contract","car","phone","tires","place"]
.forEach(id=>document.getElementById(id).value="");

document.getElementById("status").value="stored";
document.getElementById("form").style.display="block";

window.scrollTo({top:150,behavior:"smooth"});
}

function cancelForm(){

editingId=null;
document.getElementById("form").style.display="none";

}

async function saveRecord(){

const fio=document.getElementById("fio").value.trim();
const contract=document.getElementById("contract").value.trim();
const car=document.getElementById("car").value.trim();
const phone=document.getElementById("phone").value.trim();
const tires=document.getElementById("tires").value.trim();
const place=document.getElementById("place").value.trim();
const status=document.getElementById("status").value;

if(!fio||!contract||!car||!phone||!tires||!place){

alert("Заполните все поля");
return;

}

if(
!Number.isInteger(Number(contract))||
Number(contract)<1||
Number(contract)>250
){

alert("Номер договора должен быть от 1 до 250");
return;

}

const duplicateContract=records.find(item=>
Number(item.contract)===Number(contract)&&
item.id!==editingId
);

if(duplicateContract){

alert("Договор № "+contract+" уже существует");
return;

}

const occupiedPlace=records.find(item=>
String(item.place).trim().toLowerCase()===
place.toLowerCase()&&
item.status==="stored"&&
item.id!==editingId
);

if(occupiedPlace){

const ok=confirm(
"Внимание! Место № "+place+
" уже занято договором № "+
occupiedPlace.contract+
". Всё равно сохранить?"
);

if(!ok)return;
}

const data={
fio,
contract,
car,
phone,
tires,
place,
status,
updated_at:new Date().toISOString()
};

try{

if(editingId!==null){

await api("?id=eq."+editingId,{
method:"PATCH",
body:JSON.stringify(data)
});

}else{

data.created_at=new Date().toISOString();

await api("",{
method:"POST",
body:JSON.stringify(data)
});

}

editingId=null;

document.getElementById("form").style.display="none";

await loadRecords();

}catch(error){

console.error(error);
alert("Ошибка сохранения");

}
}

function editRecord(id){

const item=records.find(r=>r.id===id);

if(!item)return;

editingId=id;

document.getElementById("formTitle").textContent=
"Редактирование";

document.getElementById("fio").value=item.fio||"";
document.getElementById("contract").value=item.contract;
document.getElementById("car").value=item.car;
document.getElementById("phone").value=item.phone;
document.getElementById("tires").value=item.tires;
document.getElementById("place").value=item.place;
document.getElementById("status").value=item.status;

document.getElementById("form").style.display="block";

window.scrollTo({top:150,behavior:"smooth"});
}

async function toggleStatus(id){

const item=records.find(r=>r.id===id);

if(!item)return;

const status=
item.status==="stored"?"returned":"stored";

try{

await api("?id=eq."+id,{
method:"PATCH",
body:JSON.stringify({
status,
updated_at:new Date().toISOString()
})
});

await loadRecords();

}catch(error){

console.error(error);
alert("Ошибка изменения статуса");

}
}

async function deleteRecord(id){

const item=records.find(r=>r.id===id);

if(!item)return;

if(!confirm("Удалить договор № "+item.contract+"?")){
return;
}

try{

await api("?id=eq."+id,{
method:"DELETE",
prefer:"return=minimal"
});

await loadRecords();

}catch(error){

console.error(error);
alert("Ошибка удаления");

}
}

function searchRecords(){

const query=
document.getElementById("search")
.value.toLowerCase().trim();

const filter=
document.getElementById("statusFilter").value;

const filtered=records.filter(item=>{

const text=[
item.fio||"",
item.contract,
item.car,
item.phone,
item.tires,
item.place
].join(" ").toLowerCase();

return text.includes(query)&&
(filter==="all"||item.status===filter);

});

renderRecords(filtered);
}

function formatDate(date){

if(!date)return "";

try{
return new Date(date).toLocaleString("ru-RU");
}catch{
return date;
}

}

function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

function renderRecords(list=records){

const container=document.getElementById("records");

const storedRecords=
records.filter(item=>item.status==="stored");

document.getElementById("total").textContent=
records.length;

document.getElementById("stored").textContent=
storedRecords.length;

document.getElementById("places").textContent=
new Set(
storedRecords.map(item=>
String(item.place).trim().toLowerCase()
)
).size;

if(!list.length){

container.innerHTML=
'<div class="empty">Записей не найдено</div>';

return;
}

container.innerHTML="";

[...list]
.sort((a,b)=>Number(a.contract)-Number(b.contract))
.forEach(item=>{

const isStored=item.status==="stored";

container.innerHTML+=`
<div class="card">

<div class="status ${isStored?"stored":"returned"}">
${isStored?"На хранении":"Выдано"}
</div>

<h3>Договор № ${escapeHtml(item.contract)}</h3>

<p class="fio">👤 ${escapeHtml(item.fio||"ФИО не указано")}</p>
<p>🚗 Машина: ${escapeHtml(item.car)}</p>
<p>📞 Телефон: ${escapeHtml(item.phone)}</p>
<p>🛞 Размер: ${escapeHtml(item.tires)}</p>
<p>📍 Место: ${escapeHtml(item.place)}</p>

${
item.created_at
?`<div class="small-note">
Создано: ${escapeHtml(formatDate(item.created_at))}
</div>`
:""
}

<div class="actions">

<button class="edit"
onclick="editRecord(${item.id})">
✏️ Изменить
</button>

<button class="status-btn"
onclick="toggleStatus(${item.id})">
${isStored?"📦 Выдать":"↩️ Вернуть"}
</button>

<button class="delete"
onclick="deleteRecord(${item.id})">
🗑️ Удалить
</button>

</div>
</div>
`;

});

}

/* ЭКСПОРТ */

function csvCell(value){

const text=
String(value??"").replaceAll('"','""');

return `"${text}"`;

}

function exportExcel(){

if(!records.length){

alert("В базе пока нет записей");
return;

}

const rows=[[
"Договор",
"ФИО",
"Автомобиль",
"Телефон",
"Размер колёс",
"Место",
"Статус",
"Дата создания",
"Дата изменения"
]];

[...records]
.sort((a,b)=>Number(a.contract)-Number(b.contract))
.forEach(item=>{

rows.push([
item.contract,
item.fio||"",
item.car||"",
item.phone||"",
item.tires||"",
item.place||"",
item.status==="stored"?"На хранении":"Выдано",
formatDate(item.created_at),
formatDate(item.updated_at)
]);

});

const csv=
"\uFEFF"+
rows.map(row=>row.map(csvCell).join(";"))
.join("\r\n");

const blob=
new Blob([csv],{
type:"text/csv;charset=utf-8;"
});

downloadBlob(
blob,
"K2_Хранение_"+
new Date().toISOString().slice(0,10)+
".csv"
);

}

/* РЕЗЕРВНАЯ КОПИЯ */

function createBackup(){

if(!records.length){

alert("В базе пока нет записей");
return;

}

const backup={
app:"K2 — Хранение шин",
version:2,
created:new Date().toISOString(),
count:records.length,
records
};

const blob=
new Blob(
[JSON.stringify(backup,null,2)],
{type:"application/json;charset=utf-8"}
);

downloadBlob(
blob,
"K2_BACKUP_"+
new Date().toISOString()
.slice(0,19)
.replaceAll(":","-")+
".json"
);

}

function downloadBlob(blob,filename){

const url=URL.createObjectURL(blob);
const link=document.createElement("a");

link.href=url;
link.download=filename;

document.body.appendChild(link);

link.click();
link.remove();

setTimeout(()=>URL.revokeObjectURL(url),1000);

}

/* ВОССТАНОВЛЕНИЕ */

async function restoreBackup(event){

const file=event.target.files[0];

if(!file)return;

try{

const text=await file.text();
const backup=JSON.parse(text);

if(!backup.records||!Array.isArray(backup.records)){

alert("Это не резервная копия K2");
event.target.value="";
return;

}

const ok=confirm(
"В резервной копии записей: "+
backup.records.length+
".\n\nЗаписи с существующими номерами договоров будут обновлены, новые — добавлены.\n\nПродолжить?"
);

if(!ok){

event.target.value="";
return;

}

for(const item of backup.records){

const data={
fio:item.fio||"",
contract:item.contract,
car:item.car||"",
phone:item.phone||"",
tires:item.tires||"",
place:item.place||"",
status:item.status||"stored",
updated_at:item.updated_at||
new Date().toISOString()
};

if(item.created_at){
data.created_at=item.created_at;
}

const existing=
records.find(r=>
Number(r.contract)===Number(item.contract)
);

if(existing){

await api("?id=eq."+existing.id,{
method:"PATCH",
body:JSON.stringify(data)
});

}else{

await api("",{
method:"POST",
body:JSON.stringify(data)
});

}

}

await loadRecords();

alert("Резервная копия восстановлена успешно");

}catch(error){

console.error(error);
alert("Ошибка восстановления резервной копии");

}

event.target.value="";

}

loadRecords();

</script>

</body>
</html>
