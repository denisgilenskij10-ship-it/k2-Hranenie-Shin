<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K2 Хранение шин</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #050505, #252525);
      padding: 22px 18px;
      border-bottom: 2px solid #c9a227;
    }

    header h1 {
      color: #c9a227;
      font-size: 28px;
    }

    header p {
      color: #bbb;
      margin-top: 6px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 18px;
    }

    .search {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: 1px solid #444;
      background: #222;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .gold {
      background: #c9a227;
      color: black;
    }

    .add-btn {
      width: 100%;
      margin-bottom: 20px;
      background: #c9a227;
      color: black;
      font-size: 18px;
    }

    .form {
      display: none;
      background: #1c1c1c;
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 20px;
      border: 1px solid #444;
    }

    .form h2 {
      margin-bottom: 15px;
      color: #c9a227;
    }

    .form input {
      margin-bottom: 12px;
    }

    .save-btn {
      width: 100%;
      background: #c9a227;
      color: black;
    }

    .records-title {
      margin: 15px 0;
      color: #c9a227;
    }

    .card {
      background: #1d1d1d;
      border: 1px solid #333;
      border-left: 4px solid #c9a227;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .card h3 {
      margin-bottom: 10px;
      font-size: 19px;
    }

    .card p {
      color: #ccc;
      margin: 6px 0;
    }

    .empty {
      color: #777;
      text-align: center;
      padding: 30px;
    }

    .delete {
      margin-top: 12px;
      background: #333;
      color: #ff7777;
      padding: 10px 14px;
      font-size: 14px;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      flex: 1;
      background: #1c1c1c;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid #333;
    }

    .stat b {
      display: block;
      font-size: 24px;
      color: #c9a227;
    }

    .stat span {
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>K2 — Хранение шин</h1>
  <p>Учёт клиентов и хранения колёс</p>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      <b id="total">0</b>
      <span>Всего клиентов</span>
    </div>

    <div class="stat">
      <b id="places">0</b>
      <span>Занято мест</span>
    </div>
  </div>

  <div class="search">
    <input
      type="text"
      id="search"
      placeholder="Поиск: телефон, машина, договор..."
      oninput="searchRecords()"
    >
  </div>

  <button class="add-btn" onclick="showForm()">
    + Добавить хранение
  </button>

  <div class="form" id="form">

    <h2>Новое хранение</h2>

    <input
      type="number"
      id="contract"
      placeholder="Номер договора (1–250)"
    >

    <input
      type="text"
      id="car"
      placeholder="Номер автомобиля"
    >

    <input
      type="tel"
      id="phone"
      placeholder="Номер телефона"
    >

    <input
      type="text"
      id="tires"
      placeholder="Размер колёс (например 225/45 R17)"
    >

    <input
      type="text"
      id="place"
      placeholder="Номер места"
    >

    <button class="save-btn" onclick="addRecord()">
      Сохранить
    </button>

  </div>

  <h2 class="records-title">Хранение</h2>

  <div id="records"></div>

</div>

<script>

let records = JSON.parse(localStorage.getItem("k2Records")) || [];

function saveRecords() {
  localStorage.setItem("k2Records", JSON.stringify(records));
}

function showForm() {
  const form = document.getElementById("form");

  if (form.style.display === "block") {
    form.style.display = "none";
  } else {
    form.style.display = "block";
  }
}

function addRecord() {

  const contract = document.getElementById("contract").value.trim();
  const car = document.getElementById("car").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const tires = document.getElementById("tires").value.trim();
  const place = document.getElementById("place").value.trim();

  if (!contract || !car || !phone || !tires || !place) {
    alert("Заполните все поля");
    return;
  }

  if (Number(contract) < 1 || Number(contract) > 250) {
    alert("Номер договора должен быть от 1 до 250");
    return;
  }

  const existing = records.find(
    item => item.contract === contract
  );

  if (existing) {
    alert("Такой номер договора уже существует");
    return;
  }

  records.push({
    id: Date.now(),
    contract,
    car,
    phone,
    tires,
    place
  });

  saveRecords();

  document.getElementById("contract").value = "";
  document.getElementById("car").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("tires").value = "";
  document.getElementById("place").value = "";

  document.getElementById("form").style.display = "none";

  renderRecords();
}

function deleteRecord(id) {

  if (!confirm("Удалить запись?")) return;

  records = records.filter(item => item.id !== id);

  saveRecords();

  renderRecords();
}

function renderRecords(list = records) {

  const container = document.getElementById("records");

  document.getElementById("total").textContent = records.length;

  const uniquePlaces = new Set(
    records.map(item => item.place)
  );

  document.getElementById("places").textContent =
    uniquePlaces.size;

  if (list.length === 0) {
    container.innerHTML =
      '<div class="empty">Записей пока нет</div>';
    return;
  }

  container.innerHTML = "";

  list
    .sort((a, b) => Number(a.contract) - Number(b.contract))
    .forEach(item => {

      container.innerHTML += `
        <div class="card">

          <h3>Договор № ${item.contract}</h3>

          <p>🚗 Машина: ${item.car}</p>
          <p>📞 Телефон: ${item.phone}</p>
          <p>🛞 Размер: ${item.tires}</p>
          <p>📍 Место: ${item.place}</p>

          <button
            class="delete"
            onclick="deleteRecord(${item.id})"
          >
            Удалить
          </button>

        </div>
      `;
    });
}

function searchRecords() {

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase();

  const filtered = records.filter(item =>
    item.contract.toLowerCase().includes(query) ||
    item.car.toLowerCase().includes(query) ||
    item.phone.toLowerCase().includes(query) ||
    item.tires.toLowerCase().includes(query) ||
    item.place.toLowerCase().includes(query)
  );

  renderRecords(filtered);
}

renderRecords();

</script>

</body>
</html>
